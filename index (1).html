<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="NEXO: protótipo de app para jovens planejarem a carreira.">
<title>NEXO – Protótipo</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f1f8fb;--card:#fff;--ink:#0b3a4f;--mut:#58798a;--pri:#00b4d0;--pri2:#006f8c;--soft:#dff3f8;--line:#d3e7ee;--onpri:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1e28;--card:#122b38;--ink:#e6f4f8;--mut:#9bb9c5;--pri:#22d3ee;--pri2:#0e7490;--soft:#164050;--line:#1f4757;--onpri:#04222c}}
:root[data-theme="dark"]{--bg:#0a1e28;--card:#122b38;--ink:#e6f4f8;--mut:#9bb9c5;--pri:#22d3ee;--pri2:#0e7490;--soft:#164050;--line:#1f4757;--onpri:#04222c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Nunito","Segoe UI",system-ui,sans-serif;font-size:16px;line-height:1.45}
*{box-sizing:border-box}
#app{max-width:440px;min-height:100%;margin:0 auto;background:var(--bg);position:relative;padding-bottom:84px}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.splash{min-height:100vh;background:linear-gradient(160deg,#00b4d0,#007f9c);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;text-align:center;gap:14px}
.splash h1{font-size:44px;letter-spacing:2px;font-weight:800}
.splash p{opacity:.92;max-width:240px}
.splash input{width:100%;max-width:300px;padding:14px 16px;border-radius:14px;border:0;font:inherit;text-align:center;margin-top:18px}
.btn{display:block;width:100%;padding:14px 18px;border-radius:14px;background:var(--pri);color:var(--onpri);font-weight:700;text-align:center}
.btn.dark{background:var(--pri2);color:#fff}
.btn.ghost{background:var(--soft);color:var(--ink)}
.splash .btn{max-width:300px;background:#fff;color:#006f8c}
.top{display:flex;align-items:center;justify-content:space-between;padding:16px 20px}
.logo{font-weight:800;color:var(--pri);font-size:22px;letter-spacing:1px}
.av{width:38px;height:38px;border-radius:50%;background:var(--pri2);color:#fff;display:grid;place-items:center;font-weight:800}
.pad{padding:0 20px}
.hello{font-size:28px;font-weight:800;margin-top:4px}
.mut{color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:16px}
.prog{display:flex;align-items:center;gap:16px}
.ring{--p:0;width:58px;height:58px;border-radius:50%;background:conic-gradient(var(--pri) calc(var(--p)*1%),var(--soft) 0);display:grid;place-items:center;flex:none}
.ring i{width:42px;height:42px;border-radius:50%;background:var(--card);display:block}
.steps{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.step{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.step.on{border-color:var(--pri);background:var(--soft)}
.step .n{width:38px;height:38px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-weight:800;color:var(--pri2);flex:none}
.step.on .n,.step.done .n{background:var(--pri);color:var(--onpri)}
.step b{display:block}
.step small{color:var(--mut)}
.step .end{margin-left:auto;color:var(--mut)}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px))}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mut);padding:4px 8px}
.nav button.on{color:var(--pri2);font-weight:800}
.nav span{font-size:20px}
.back{display:flex;align-items:center;gap:8px;padding:16px 20px;color:var(--mut);justify-content:space-between}
.back button{color:var(--ink);font-weight:700}
.dots{display:flex;gap:6px;justify-content:center;margin:6px 0 18px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--pri);width:22px;border-radius:6px}
.q{font-size:26px;font-weight:800;margin:6px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
.chip{padding:10px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-weight:600}
.chip.on{background:var(--pri);border-color:var(--pri);color:var(--onpri)}
.rate{margin-top:16px}
.rate .row{display:flex;gap:6px;margin-top:6px}
.rate .row button{flex:1;padding:10px 0;border-radius:10px;border:1.5px solid var(--line);background:var(--card);font-weight:700}
.rate .row button.on{background:var(--pri);border-color:var(--pri);color:var(--onpri)}
.hint{font-size:14px;color:var(--mut)}
.bar{height:10px;border-radius:6px;background:var(--soft);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pri);border-radius:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two .card{margin-top:10px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:90%;z-index:9}
.sp{height:14px}
.rate .row button.ns{flex:.7;font-size:13px}
.lk{display:block;padding:10px 0;border-top:1px solid var(--line);color:var(--ink);text-decoration:none}
.lk b{text-decoration:underline}
.lk small{display:block;color:var(--mut)}
select.inp{appearance:auto}
.av{border:0}
.inp{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;margin-top:6px}
.lg{width:210px;max-width:70%;height:auto}
.hl{height:26px;width:auto;display:block}
.nvlogo{display:none}
@media (min-width:900px){
#app{max-width:1120px}
#app:not(.tabs){max-width:none}
#app.tabs{padding-left:220px;padding-bottom:32px}
.pad,.back{max-width:760px;margin-left:auto;margin-right:auto}
#app.tabs .pad,#app.tabs .top{max-width:820px;margin-left:0;margin-right:0;padding-left:32px;padding-right:32px}
.nav{top:0;bottom:0;left:max(0px,calc(50% - 560px));transform:none;width:220px;max-width:220px;flex-direction:column;justify-content:flex-start;gap:6px;border-top:0;border-right:1px solid var(--line);padding:24px 12px}
.nav button{flex-direction:row;gap:12px;font-size:15px;padding:12px 14px;border-radius:12px;width:100%;justify-content:flex-start}
.nav button.on{background:var(--soft)}
.nvlogo{display:block;padding:4px 14px 20px}
.nvlogo img{height:30px;width:auto}
.two{gap:16px}
.step:hover,.chip:hover,.btn:hover{filter:brightness(.97)}
}
</style>
</head>

function badges(){var j=jprog(),a=S.plan.some(function(x){return x.s===2});return[["Primeiro passo","Concluiu o diagnóstico",S.done],["Objetivo definido","Escolheu a carreira",!!S.fx[2]],["Plano criado","Montou o plano",!!S.fx[4]],["Primeira ação","Concluiu uma ação do plano",a],["Metade do caminho","Concluiu metade do plano",S.plan.length>0&&pct()>=50],["Fase concluída","Concluiu uma fase da jornada",j.ph.some(function(f){return f.n&&f.d===f.n})]]}
function pilotTxt(){var B=S.base;return JSON.stringify({id:S.uid,faixa:S.menor?"menor de 18":"18 ou mais",uf:S.uf,carreira:S.area,etapas:S.ts,clareza_inicio:S.cl0||null,clareza_atual:S.cl1||null,satisfacao:S.sat||null,lacunas_inicio:B?gc(B.hb||{},B.cp||{},B.tec||{}):null,lacunas_atual:gc(S.hb,S.cp,S.tec),acoes_concluidas:S.plan.filter(function(a){return a.s===2}).length,acoes_total:S.plan.length},null,1)}
function extraPerfil(){return '<div class="card"><b>Conquistas</b>'+badges().map(function(x){return rw((x[2]?"✓ ":"○ ")+x[0],x[1])}).join("")+'</div><div class="card"><b>Tamanho do texto</b><div class="chips">'+["A","A+","A++"].map(function(t,i){var on=(S.fs||0)===i;return '<button class="chip'+(on?" on":"")+'" aria-pressed="'+on+'" onclick="S.fs='+i+';save();render()">'+t+'</button>'}).join("")+'</div></div>'+(S.menor?'<button class="btn ghost" style="margin-top:12px" onclick="go(\'resp\')">Área do responsável</button>':'')+'<button class="btn ghost" style="margin-top:10px" onclick="go(\'legal\')">Resumo de privacidade</button><button class="btn ghost" style="margin-top:10px" onclick="cpy(pilotTxt())">Copiar dados do piloto (sem nome)</button>'}
function vResp(){var j=jprog();return '<div class="back"><button onclick="go(\'perfil\')">‹ Perfil</button><span>Área do responsável</span></div><div class="pad"><h1 class="q">Área do responsável</h1><p class="mut">Aqui o responsável acompanha o uso do NEXO e controla a autorização. Em um app real, esta área exige o login do próprio responsável.</p><div class="card"><b>Autorização</b>'+rw("Responsável",esc((S.guard||{}).nome))+rw("Jovem",esc(S.name))+rw("Situação","Autorizado (simulado)")+'</div><div class="card"><b>Progresso do jovem</b>'+rw("Etapas concluídas",nDone()+" de 5")+rw("Passos da jornada",j.ok+" de "+j.tot)+rw("Plano concluído",pct()+"%")+'</div><div class="card"><b>Dados que o app guarda</b><ul style="padding-left:18px;margin:8px 0 0"><li>Nome, apelido, data de nascimento, cidade e estado</li><li>Respostas do diagnóstico, metas e plano</li><li>Conta de login (método e e-mail parcial)</li></ul><p class="hint" style="margin-top:8px">Neste protótipo, tudo fica apenas neste aparelho.</p></div>'+(rv?'<div class="card"><p>Isso apaga todos os dados e encerra a conta neste aparelho. Não dá para desfazer.</p><button class="btn dark" style="margin-top:10px" onclick="clearAll()">Confirmar: revogar e apagar</button><button class="btn ghost" style="margin-top:10px" onclick="rv=false;render()">Cancelar</button></div>':'<button class="btn ghost" onclick="rv=true;render()">Revogar autorização e apagar dados</button>')+'<div class="sp"></div></div>'}
function vLegal(){var I=[["Quais dados usamos","Nome, apelido, data de nascimento, cidade, estado, respostas do diagnóstico, metas e plano."],["Para quê","Montar seu plano de desenvolvimento profissional e indicar onde estudar e se qualificar. Não usamos seus dados para anúncios."],["Menores de idade","Se você tem menos de 18 anos, um responsável precisa entrar e autorizar o uso. Ele pode acompanhar seu progresso e pedir a exclusão dos dados."],["Inteligência artificial","Para algumas carreiras, o que você escreve pode ser enviado a uma IA para sugerir competências e cursos. Não escreva dados pessoais. As sugestões podem errar: confirme em fontes oficiais."],["Seus direitos","Você ou seu responsável podem pedir acesso, correção e exclusão dos dados. Contato: [a definir]."],["Neste protótipo","Os dados ficam só neste aparelho e podem ser apagados a qualquer momento no Perfil."]];return '<div class="back"><button onclick="go(S.auth?\'perfil\':\'login\')">‹ Voltar</button><span>Privacidade</span></div><div class="pad"><h1 class="q">Resumo de privacidade</h1><p class="hint" style="padding:10px;border:1px solid var(--line);border-radius:12px">RASCUNHO. Resumo em linguagem simples feito para o protótipo. Precisa de revisão jurídica antes do lançamento.</p>'+I.map(function(x){return '<div class="card"><b>'+x[0]+'</b><p class="mut" style="margin-top:6px">'+x[1]+'</p></div>'}).join("")+'<div class="sp"></div></div>'}
function vDiag(){S.dl=S.d;var s=SUB[S.d],body="";
 if(S.d===0)body=localBlock();
 if(S.d===1)body=chipBlock(KN,"kn")+'<p style="margin-top:6px"><b>Outros conhecimentos</b></p>'+xChips("knx")+addBlock("ak","Ex.: Canva, violão, informática","addX(\'ak\',\'knx\')")+'<p style="margin-top:18px"><b>Cursos que estou fazendo</b></p>'+xChips("cur")+addBlock("ac","Ex.: Inglês básico na escola","addX(\'ac\',\'cur\')")+PRIV;
 if(S.d===2)body=rateBlock(HB.concat(S.hbx),"hb")+'<p style="margin-top:18px"><b>Outra habilidade</b></p>'+addBlock("ah","Ex.: Edição de vídeo","addX(\'ah\',\'hbx\')")+PRIV;
 if(S.d===3)body=chipBlock(EX,"ex")+xChips("exx")+addBlock("ae","Ex.: Ajudei no campeonato da escola","addX(\'ae\',\'exx\')")+PRIV;
 if(S.d===4)body=rateBlock(CP.concat(S.cpx),"cp")+'<p style="margin-top:18px"><b>Outro comportamento</b></p>'+addBlock("ap","Ex.: Paciência com crianças","addX(\'ap\',\'cpx\')")+PRIV;
 return '<div class="back"><button onclick="prev()">‹ Voltar</button><span>Diagnóstico · '+(S.d+1)+' de 5</span></div><div class="pad"><div class="dots">'+[0,1,2,3,4].map(function(i){return '<i class="'+(i===S.d?"on":"")+'"></i>'}).join("")+'</div><p class="hint">'+s.t+'</p><h1 class="q">'+s.q+'</h1><p class="mut">'+s.d+'</p>'+body+'<button class="btn" onclick="next()">'+(S.d<4?"Continuar":"Concluir diagnóstico")+'</button>'+(S.d>0?'<button class="btn ghost" style="margin-top:10px" onclick="next()">Pular esta tela</button>':'')+'<button class="btn ghost" style="margin-top:10px" onclick="go(\'home\')">Salvar e continuar depois</button><div class="sp"></div></div>'}
function bars(list,k){return list.map(function(n){var v=Math.max(0,S[k][n]||0);return '<div style="margin-top:12px"><div style="display:flex;justify-content:space-between"><span>'+n+'</span><b>'+(v||"–")+'/5</b></div><div class="bar"><i style="width:'+v*20+'%"></i></div></div>'}).join("")}
function vResult(){var all=[];HB.concat(S.hbx).forEach(function(n){if(S.hb[n]>0)all.push([n,S.hb[n]])});CP.concat(S.cpx).forEach(function(n){if(S.cp[n]>0)all.push([n,S.cp[n]])});
 all.sort(function(a,b){return b[1]-a[1]});var top=all.slice(0,2),low=all.slice(-2).reverse();
 var li=function(a){return a.map(function(x){return '<li>'+x[0]+' ('+x[1]+'/5)</li>'}).join("")};
 var sum=all.length?'<div class="two"><div class="card"><b>Pontos fortes</b><ul style="padding-left:18px;margin:8px 0 0">'+li(top)+'</ul></div><div class="card"><b>Para desenvolver</b><ul style="padding-left:18px;margin:8px 0 0">'+li(low)+'</ul></div></div>':'<div class="card"><p class="mut">Você não deu nenhuma nota. Refaça o diagnóstico para ver seus pontos fortes.</p></div>';
 return '<div class="back"><button onclick="go(\'home\')">‹ Início</button><span>Diagnóstico concluído</span></div><div class="pad"><h1 class="q">Seu perfil atual</h1><p class="mut">Este é o ponto de partida da sua jornada, '+esc(S.name)+'.</p>'+sum
 +'<div class="card"><b>Conhecimentos</b><p class="mut" style="margin-top:6px">'+(S.kn.length?S.kn.join(", "):"Nenhum marcado")+'</p></div>'
 +'<div class="card"><b>Experiências</b><p class="mut" style="margin-top:6px">'+(S.ex.length?S.ex.join(", "):"Nenhuma marcada")+'</p></div>'
 +'<div class="card"><b>Habilidades</b>'+bars(HB.concat(S.hbx),"hb")+'</div><div class="card"><b>Competências</b>'+bars(CP.concat(S.cpx),"cp")+'</div>'
 +'<button class="btn" style="margin-top:16px" onclick="go(\'home\')">Voltar à jornada</button><button class="btn ghost" style="margin-top:10px" onclick="reset()">Refazer diagnóstico</button><div class="sp"></div></div>'}
